# Manual release: builds Linux, macOS and Windows (build.yml), tags the commit as v<version> and moves the "latest"
# tag to it, and publishes a GitHub release: the Linux AppImage, the macOS app (zipped) and a zip per Windows
# architecture. Run it from the Actions tab on main. The builds carry the version (Info.plist, AppImage, the .exe's
# file version).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (tag v<version>)
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir -p dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if [ -n "$(find "$dir" -maxdepth 1 -name '*.AppImage')" ]; then
              # Linux: the AppImage on its own (made executable after download: chmod +x)
              cp "$dir"/*.AppImage "dist/${name%-x64}-x86_64-v${{ inputs.version }}.AppImage"
              continue
            fi
            if [ -f "$dir/$name.app.zip" ]; then
              # macOS: the app bundle, already zipped with ditto by build.yml
              cp "$dir/$name.app.zip" "dist/${name}-v${{ inputs.version }}.zip"
              continue
            fi
            cp README.md "$dir/README.md"
            (cd "$dir" && zip -r "../../dist/${name}-v${{ inputs.version }}.zip" .)
          done
          ls -l dist
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Pokémon Stadium port v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
          gh release create "v$VERSION" dist/* --title "v$VERSION" --target "$GITHUB_SHA" \
            --notes "Builds for Linux (x86_64 AppImage), macOS (Apple Silicon, Pokemon Stadium.app) and Windows (x64 and arm64). No game data included: you need your own Pokémon Stadium (USA) ROM. See README.md."
