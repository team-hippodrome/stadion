<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadium Save Editor</title>
<style>
:root {
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3; --line:#dcdfe5; --fg:#1b1f26; --muted:#677080;
  --accent:#d0342c; --accent-fg:#fff; --ok:#1f8a3b; --warn:#b26a00; --sel:#fde8e6; --shadow:0 8px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#12161d; --panel:#1a1f27; --panel2:#222833; --line:#2c3440; --fg:#e6e9ee; --muted:#8b95a3;
  --accent:#e5484d; --accent-fg:#fff; --ok:#3fb950; --warn:#e3a008; --sel:#3a2326; --shadow:0 8px 30px rgba(0,0,0,.5);
} }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; font:14px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg);
  display:flex; flex-direction:column; }
button, select, input { font:inherit; color:inherit; }
button { padding:6px 14px; border-radius:7px; border:1px solid var(--line); background:var(--panel); cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--muted); }
button:disabled { opacity:.45; cursor:default; }
button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; }
button.small { padding:3px 10px; font-size:12px; }
button.link { border:none; background:none; color:var(--accent); padding:2px 4px; }
button.danger { color:var(--accent); }
input, select { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 8px; min-width:0; }
input[type=number] { width:80px; }
input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); }
input:invalid { border-color:var(--accent); }
label { color:var(--muted); font-size:12px; display:block; margin-bottom:3px; }
h2 { font-size:20px; margin:0 0 4px; }
h3 { font-size:15px; margin:0 0 10px; }
p.lead { color:var(--muted); margin:0 0 18px; }
.muted { color:var(--muted); }
.row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
.grow { flex:1; }

header { display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--line);
  background:var(--panel); }
header .title { font-weight:700; font-size:16px; white-space:nowrap; }
header .file { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40vw; }
#status { font-size:12px; padding:3px 10px; border-radius:20px; background:var(--panel2); color:var(--muted); white-space:nowrap; }
#status.dirty { background:var(--sel); color:var(--accent); font-weight:600; }
#status.err { background:var(--sel); color:var(--accent); }

.layout { flex:1; display:flex; min-height:0; }
nav { width:210px; flex:none; border-right:1px solid var(--line); padding:12px 8px; overflow:auto; background:var(--panel); }
nav a { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-radius:7px;
  color:var(--fg); text-decoration:none; cursor:pointer; margin-bottom:2px; }
nav a:hover { background:var(--panel2); }
nav a.sel { background:var(--accent); color:var(--accent-fg); }
nav a .count { font-size:11px; opacity:.75; }
nav hr { border:none; border-top:1px solid var(--line); margin:10px 6px; }
main { flex:1; overflow:auto; padding:22px 26px 40px; }

.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; margin-bottom:16px; }
.cards .card { margin:0; }
.stat { font-size:26px; font-weight:700; }
.banner { display:flex; gap:14px; align-items:center; border-radius:10px; padding:14px 18px; margin-bottom:16px;
  border:1px solid var(--line); background:var(--panel); }
.banner.ok { border-color:var(--ok); }
.banner.warn { border-color:var(--warn); }
.banner .icon { font-size:22px; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.tabs button { border-radius:20px; }
.tabs button.sel { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }

.split { display:grid; grid-template-columns:240px 1fr; gap:16px; align-items:start; }
.slotlist .slot { display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:8px; cursor:pointer;
  border:1px solid transparent; }
.slotlist .slot:hover { background:var(--panel2); }
.slotlist .slot.sel { border-color:var(--accent); background:var(--sel); }
.slotlist .slot .n { width:22px; color:var(--muted); font-size:12px; text-align:right; }
.slotlist .slot .minis { display:flex; gap:2px; }

.mongrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
.mon { display:flex; gap:10px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:9px;
  background:var(--panel); cursor:pointer; min-height:62px; }
.mon:hover { border-color:var(--muted); }
.mon.empty { border-style:dashed; color:var(--muted); justify-content:center; }
.mon .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mon .sub { font-size:12px; color:var(--muted); }
.ball { flex:none; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; font-size:13px; text-shadow:0 1px 2px rgba(0,0,0,.45); position:relative; overflow:hidden; }
.ball.half::after { content:""; position:absolute; right:0; top:0; bottom:0; width:50%; background:var(--t2); }
.ball span { position:relative; z-index:1; }
.ball.mini { width:16px; height:16px; font-size:0; }
.boxnav { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.boxgrid { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; }

table.items { border-collapse:collapse; width:100%; }
table.items td { padding:4px 6px; border-bottom:1px solid var(--line); }
table.items td:first-child { width:100%; }
table.items select { width:100%; }

.dexgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:6px; }
.dex { padding:6px 8px; border:1px solid var(--line); border-radius:7px; cursor:pointer; font-size:12px; background:var(--panel);
  display:flex; gap:6px; align-items:center; }
.dex.has { border-color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, var(--panel)); font-weight:600; }
.dex.sel { outline:2px solid var(--accent); }
.dex .no { color:var(--muted); font-size:11px; }
.check { display:flex; gap:8px; align-items:center; color:var(--fg); font-size:14px; margin:6px 0; cursor:pointer; }
.formgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px 16px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg button { border:none; border-radius:0; border-right:1px solid var(--line); }
.seg button:last-child { border-right:none; }
.seg button.sel { background:var(--accent); color:var(--accent-fg); }
.hint { font-size:12px; color:var(--muted); margin-top:6px; }
.warnlist { color:var(--warn); font-size:12px; margin:8px 0 0; padding-left:18px; }
.typebadge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; color:#fff; margin-right:4px;
  text-shadow:0 1px 1px rgba(0,0,0,.35); }

dialog { border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--fg); padding:0;
  width:min(680px, 94vw); box-shadow:var(--shadow); }
dialog::backdrop { background:rgba(0,0,0,.45); }
dialog .head { display:flex; gap:14px; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
dialog .body { padding:16px 20px; min-height:300px; }
dialog .foot { display:flex; gap:8px; padding:12px 20px; border-top:1px solid var(--line); }
table.stats { border-collapse:collapse; margin-top:6px; }
table.stats th, table.stats td { padding:4px 10px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
table.stats th:first-child, table.stats td:first-child { text-align:left; }
table.stats input { width:74px; }
.moverow { display:grid; grid-template-columns:1fr 120px 110px; gap:10px; align-items:center; margin-bottom:8px; }
textarea { width:100%; min-height:55vh; font:12px/1.4 ui-monospace, Menlo, monospace; background:var(--bg); color:var(--fg);
  border:1px solid var(--line); border-radius:6px; padding:8px; }
pre { white-space:pre-wrap; font:12px/1.4 ui-monospace, Menlo, monospace; color:var(--muted); }
#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--fg); color:var(--bg);
  padding:8px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
#toast.show { opacity:.95; }
.empty-state { text-align:center; padding:40px; color:var(--muted); }
nav .group { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:4px 12px 6px; }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
.pair .card { margin:0; }
.compact { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.compact .mon { padding:6px 26px 6px 8px; min-height:50px; gap:8px; position:relative; }
.compact .mon.empty { padding:6px 8px; }
.compact .ball { width:28px; height:28px; font-size:10px; }
.compact .mon .name { font-size:13px; }
.compact .mon .sub { font-size:11px; }
.mon .move { position:absolute; right:4px; top:4px; padding:0 6px; font-size:12px; line-height:18px; border-radius:5px;
  background:var(--panel2); border:1px solid var(--line); color:var(--fg); }
.mon .move:hover:not(:disabled) { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.dex.seen { border-style:dashed; border-color:var(--muted); }
.legend { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-bottom:10px; align-items:center; }
.legend .dex { cursor:default; display:inline-flex; padding:2px 8px; }
</style></head><body>
<header>
  <span class="title">Pokémon Stadium save</span>
  <span class="file" id="file">no save loaded</span>
  <span id="status">Loading…</span>
  <span class="grow"></span>
  <button type="button" id="openBtn">Open save…</button><input type="file" id="fileInput" hidden>
  <button id="discard" disabled title="Go back to the file as it is on disk">Discard changes</button>
  <button class="primary" id="saveBtn" disabled>Save</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="empty-state">Open a Pokémon Stadium save (.flash / .fla, 128 KiB) to start.</div></main>
</div>

<dialog id="monDlg"></dialog>
<div id="toast"></div>
<datalist id="speciesList"></datalist>

<script>
"use strict";
// ---- state -----------------------------------------------------------------------------------------------------
let META = null;            // /api/meta
let base = null;            // dump the current edits are relative to (the file on disk)
let baseStr = "";
let cur = null;             // edited dump
let fileName = "pokestadium.flash", filePath = "", writable = false;
let gbs = [];               // Game Boy saves (Transfer Paks): {id, label, title, kind, lang, name, path, base, baseStr, cur}
const view = { section: "overview", cat: "poke_cup", slot: 0, box: 0, ibox: 0, dex: 25, json: "options",
               gbTab: "party", gbBox: 0, xg: 0, xstore: "party" };

const CATS = [
  ["free_battle", "Free Battle", "Any Pokémon at any level."],
  ["poke_cup", "Poké Cup", "Game rule: levels 50–55, and the three Pokémon you send in may add up to level 155 at most."],
  ["petit_cup", "Petit Cup", "Game rule: levels 25–30 (three add up to 80 at most), small Pokémon only."],
  ["pika_cup", "Pika Cup", "Game rule: levels 15–20 (three add up to 50 at most)."],
  ["prime_cup", "Prime Cup", "Game rule: levels 1–100."],
  ["gym_leader_castle", "Gym Leader Castle", "Any level up to 100."],
  ["mewtwo", "Vs. Mewtwo", "Your team for the Mewtwo battle."],
  ["category_1", "Hidden cup 1", "A Poké Cup copy that the game's menus never show."],
  ["category_2", "Hidden cup 2", "A Poké Cup copy that the game's menus never show."],
];
const CAT_LEVEL = { poke_cup: 50, petit_cup: 25, pika_cup: 15, prime_cup: 100, gym_leader_castle: 50, mewtwo: 100 };
const CUP_BITS = [[3, "Poké Cup"], [4, "Petit Cup"], [5, "Pika Cup"], [6, "Prime Cup"], [7, "Gym Leader Castle"], [8, "Beat Mewtwo"]];
const STATUE_MODES = [[3, "Poké Cup"], [4, "Petit Cup"], [5, "Pika Cup"], [6, "Prime Cup"], [7, "Gym Leader Castle"]];
const TYPE_COLORS = { Normal: "#9a9a6e", Fighting: "#c03028", Flying: "#8f7ae0", Poison: "#a040a0", Ground: "#d6b45a",
  Rock: "#b8a038", Bug: "#98a820", Ghost: "#705898", Fire: "#f08030", Water: "#6890f0", Grass: "#5cb041",
  Electric: "#e8b800", Psychic: "#f85888", Ice: "#6cc8c8", Dragon: "#7038f8" };
const STAT_NAMES = { hp: "HP", atk: "Attack", def: "Defense", spd: "Speed", spc: "Special" };

// ---- helpers ---------------------------------------------------------------------------------------------------
const $ = id => document.getElementById(id);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k in e && k !== "list") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));
const text = v => typeof v === "string" ? v : (v && typeof v === "object" ? v.text : "") || "";
const pad = (n, w) => String(n).padStart(w, "0");
const valid = rec => rec && rec._footer === "valid";
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function setStatus(msg, cls) { const s = $("status"); s.textContent = msg; s.className = cls || ""; }
async function api(path, body, raw) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", body: body instanceof ArrayBuffer ? body : JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return raw ? r.arrayBuffer() : r.json();
}
function speciesInfo(name) { return META.species.find(s => s.name === name); }
function speciesByInput(v) {
  const q = String(v || "").trim().toUpperCase().replace(/^#?\d+\s*/, "");
  return META.species.find(s => s.name.toUpperCase() === q);
}
function ball(mon, mini) {
  const sp = mon && mon.species ? speciesInfo(mon.species) : null;
  const t = sp ? sp.types : [null, null];
  const c1 = TYPE_COLORS[t[0]] || "#888", c2 = TYPE_COLORS[t[1]] || c1;
  return el("span", { class: "ball" + (mini ? " mini" : "") + (c2 !== c1 ? " half" : ""), style: `background:${c1};--t2:${c2}`,
                      title: mini && sp ? sp.name : null }, el("span", {}, sp ? pad(sp.dex, 3) : "?"));
}
function typeBadge(t) { return t ? el("span", { class: "typebadge", style: `background:${TYPE_COLORS[t] || "#888"}` }, t) : null; }
function monName(m) { return m.species || ("Unknown #" + m.species_index); }

// ---- record access ---------------------------------------------------------------------------------------------
function listRecord(rec) {                // what a list record (team / box / item box) holds for the game
  return valid(rec) ? rec : { flags: 0, name: "", trainer_id: 0, entries: [] };
}
function editList(rec, fn) {              // edit a list record; an unreadable one starts from the game's reset state
  if (!valid(rec)) {
    for (const k of Object.keys(rec)) delete rec[k];
    Object.assign(rec, { flags: 0, name: "", trainer_id: 0, entries: [], _footer: "valid" });
  }
  fn(rec);
  delete rec.count_raw;
  delete rec._unused_entries;
  changed();
}
function teamRegistered(t) { return valid(t) && (t.flags & 1) && t.entries.length > 0; }
function allRecords() {
  const out = [];
  for (const c of META.team_categories) cur.teams[c].forEach((r, i) => out.push([["teams", c, i], r]));
  for (const k of ["victory_palace", "continue", "options", "album", "photos"]) out.push([[k], cur[k]]);
  cur.boxes.forEach((r, i) => out.push([["boxes", i], r]));
  cur.item_boxes.forEach((r, i) => out.push([["item_boxes", i], r]));
  return out;
}

// ---- load / save -----------------------------------------------------------------------------------------------
function load(d, keepView) {
  base = d.save; baseStr = JSON.stringify(base); cur = clone(base);
  gbs = (d.gb || []).map(g => ({ id: g.id, label: g.label, title: g.title, kind: g.kind, lang: g.lang, name: g.name,
    path: g.path, base: g.save, baseStr: JSON.stringify(g.save), cur: clone(g.save) }));
  if (!keepView && /^#gb\d$/.test(location.hash) && +location.hash.slice(3) < gbs.length) { view.section = location.hash.slice(1); keepView = true; }
  if (d.name) fileName = d.name;
  if (d.path) filePath = d.path;
  $("file").textContent = fileName;
  $("file").title = filePath || fileName;
  if (!keepView) view.section = "overview";
  changed();
}
const gbDirty = g => JSON.stringify(g.cur) !== g.baseStr;
function isDirty() { return cur !== null && (JSON.stringify(cur) !== baseStr || gbs.some(gbDirty)); }
window.showSection = s => { view.section = s; render(); };  // the launcher's player cards open their cartridge
window.hasUnsavedChanges = isDirty;       // asked by the macOS launcher before closing the window
function changed() {
  const dirty = isDirty();
  $("saveBtn").disabled = !cur || (writable && !dirty);
  $("discard").disabled = !dirty;
  setStatus(dirty ? "Unsaved changes" : (writable ? "All changes saved" : "No changes"), dirty ? "dirty" : "");
  render();
}
async function save() {
  if (!cur) return;
  try {
    if (writable) {
      const d = await api("/api/save", { base, edited: cur,
        gb: gbs.filter(gbDirty).map(g => ({ id: g.id, base: g.base, edited: g.cur })) });
      load(d, true);
      toast(d.written.length ? "Saved " + d.written.join(" and ") + " (previous versions kept as .bak)" : "Nothing to save");
    } else {
      const buf = await api("/api/encode", { base, edited: cur }, true);
      const a = el("a", { href: URL.createObjectURL(new Blob([buf])), download: fileName });
      document.body.append(a); a.click(); a.remove();
      toast("Downloaded " + fileName);
    }
  } catch (e) { setStatus("Could not save", "err"); alert("The save could not be written:\n\n" + e.message); }
}
$("saveBtn").onclick = save;
$("discard").onclick = () => { if (confirm("Throw away all changes since the last save?")) { cur = clone(base); gbs.forEach(g => g.cur = clone(g.base)); changed(); } };
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (!$("saveBtn").disabled) save(); } });
$("openBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (isDirty() && !confirm("Open another save and lose the unsaved changes?")) return;
  try { const d = await api("/api/decode", await f.arrayBuffer()); d.name = f.name; filePath = ""; writable = false; load(d); }
  catch (err) { alert("This is not a Pokémon Stadium save:\n\n" + err.message); }
  e.target.value = "";
};
window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

// ---- navigation ------------------------------------------------------------------------------------------------
const SECTIONS = [
  ["overview", "Overview"], ["progress", "Progress & unlocks"], ["options", "Options"], "-",
  ["teams", "Registered teams"], ["boxes", "Pokémon Lab boxes"], ["items", "Item boxes"], "-",
  ["palace", "Victory Palace"], ["run", "Saved cup run"], ["gallery", "Gallery"], "-", ["advanced", "Advanced"],
];
function renderNav() {
  const counts = {
    teams: META.team_categories.reduce((n, c) => n + cur.teams[c].filter(teamRegistered).length, 0),
    boxes: cur.boxes.reduce((n, b) => n + listRecord(b).entries.length, 0),
    items: cur.item_boxes.reduce((n, b) => n + listRecord(b).entries.length, 0),
    palace: cur.victory_palace.entries.filter(Boolean).length,
    run: (cur.continue.flags & 1) ? "●" : "",
  };
  const secs = [...SECTIONS];
  if (gbs.length) secs.splice(secs.length - 2, 0, "-", ["", "Game Boy (Transfer Pak)"], ...gbs.map((g, i) => ["gb" + i, g.title]));
  $("nav").replaceChildren(...secs.map(s => s === "-" ? el("hr") : !s[0] ? el("div", { class: "group" }, s[1]) :
    el("a", { class: view.section === s[0] ? "sel" : "", title: s[0].startsWith("gb") ? gbs[+s[0].slice(2)].label : null,
              onclick: () => { view.section = s[0]; render(); $("main").scrollTop = 0; } },
       s[1], counts[s[0]] ? el("span", { class: "count" }, counts[s[0]]) : s[0].startsWith("gb") ? el("span", { class: "count" },
         (gbDirtyMark(s[0]) ? "● " : "") + gbs[+s[0].slice(2)].label.replace(/^Player /, "P")) : null)));
}
function gbDirtyMark(sec) { return sec.startsWith("gb") && gbs[+sec.slice(2)] && gbDirty(gbs[+sec.slice(2)]); }
function render() {
  if (!cur) return;
  renderNav();
  if (view.section.startsWith("gb")) { $("main").replaceChildren(...[renderGB(gbs[+view.section.slice(2)])].flat()); return; }
  const fn = { overview: renderOverview, progress: renderProgress, options: renderOptions, teams: renderTeams,
               boxes: renderBoxes, items: renderItems, palace: renderPalace, run: renderRun, gallery: renderGallery,
               advanced: renderAdvanced }[view.section];
  $("main").replaceChildren(...[fn()].flat().filter(Boolean));
}
function section(title, lead, ...body) { return [el("h2", {}, title), lead ? el("p", { class: "lead" }, lead) : null, ...body]; }

// ---- overview --------------------------------------------------------------------------------------------------
function health() {
  const bad = allRecords().filter(([, r]) => !valid(r) || r._backup !== undefined);
  return bad;
}
async function repair() {

      load(d);
    } else {
      setStatus("No save loaded");
      $("saveBtn").textContent = "Download save";
    }
  } catch (e) { setStatus("Error", "err"); $("main").replaceChildren(el("div", { class: "empty-state" }, e.message)); }
})();
</script></body></html>
